# GOLI-CLI default configuration.
#
# This file is the repo-level default. Per-user overrides live at
# $GOLI_HOME/config.toml or ~/.goli-cli/config.toml. Environment variables
# prefixed with GOLI_ override everything (e.g. GOLI_MODEL_API_KEY).
#
# All values documented in src/config/schema.ts.

[model]
modelId = "gpt-oss:120b-cloud"
baseUrl = "https://ollama.com"
apiKey = ""
# Default reasoning effort for routine tasks (cheaper).
defaultEffort = "high"
# Reasoning effort for complex tasks (refactor/architecture/debug).
complexEffort = "max"
# Triggers that bump to complexEffort.
complexTriggers = ["refactor", "design", "architecture", "debug", "migrate", "rewrite"]
maxContextTokens = 1000000
# Per-request timeout.
requestTimeoutMs = 120000
# Stream responses (recommended for TUI).
streaming = true

[budget]
# Max output tokens per session (80% of 1M, leaves room for compaction).
maxTokens = 800000
# Max USD cost per session. Hard stop when exceeded.
maxCostUsd = 5.0
# Max agent-loop iterations per session.
maxIterations = 50
# Max wall-clock seconds per session.
maxWallclockSeconds = 1800
costPerMillionInputTokens = 2.5
costPerMillionOutputTokens = 10.0
costPerMillionThinkingTokens = 0.0

[retry]
# Max retry attempts for 429 / 5xx / timeout errors.
maxRetries = 3
initialBackoffMs = 1000
backoffMultiplier = 2.0
maxBackoffMs = 30000
# Jitter prevents thundering-herd retries against the same endpoint.
jitterFactor = 0.5

[stall]
# Detect 3 identical tool calls in a row (prevents the $47K LangChain incident).
identicalCallThreshold = 3
windowSize = 5
# Max consecutive parse failures before stopping.
maxParseFailures = 3

[sandbox]
# Codex three-mode standard.
mode = "workspace-write"
approvalPolicy = "on-request"
# Default network egress allowlist (covered in depth in Phase 5).
networkAllowlist = ["github.com:443", "pypi.org:443", "files.pythonhosted.org:443", "registry.npmjs.org:443", "crates.io:443"]
# cgroups v2 resource limits (Phase 5).
memoryMaxMb = 4096
memoryHighMb = 3072
cpuQuotaPercent = 200
pidMax = 512
diskMaxMb = 10240
wallclockTimeoutS = 1800

[logging]
# Log level: trace | debug | info | warn | error | silent
level = "info"
# Format: pretty (TTY) | json (pipelines)
format = "pretty"
# Lifecycle log path — defaults to $GOLI_HOME/logs/goli.log
# lifecycleLogPath = "/tmp/goli.log"

[localLlms]
# 5th AppMode — three-axis router (sensitivity / complexity / availability).
# Active only when the user runs `goli --local-llms` or /mode local-llms.
#
# Worker pool: 4 local Ollama models + 1 cloud tier. Each model has a
# specialized role; the router picks the best match per request.
orchestratorModel = "qwen3.5:4b"        # always-resident, routing/intent, cloud-failover
coderModel        = "qwen2.5-coder:7b"  # code generation / refactor
generalModel      = "qwen3:4b"          # reasoning + private-data RAG (thinking on)
fastModel         = "gemma3:4b"         # multimodal + 128K long-context
cloudModel        = "gpt-oss:120b-cloud" # high-complexity / agentic tool chains
localBaseUrl      = "http://localhost:11434"
cloudBaseUrl      = "https://ollama.com"
# cloudApiKey = ""  # set via GOLI_LOCAL_LLMS_CLOUD_API_KEY
# localApiKey = ""  # set via GOLI_LOCAL_LLMS_LOCAL_API_KEY

# Complexity axis thresholds.
longContextTokenThreshold = 32000
localMaxTokens            = 2000
cloudMaxTokens            = 8000
cloudTimeoutMs            = 30000

# Availability axis — circuit breaker (CLOSED → OPEN → HALF-OPEN → CLOSED).
circuitBreakerFailThreshold = 3
circuitBreakerCooldownMs    = 60000
circuitBreakerWindowMs      = 30000
healthProbeIntervalMs       = 30000

# Sensitivity axis — PII gating mode.
#   "redact"     → replace PII with placeholders, send sanitized to cloud, restore in response
#   "local-only" → restricted/PII payloads are hard-gated to local workers (cloud never sees them)
#   "off"        → sensitivity axis disabled (testing only!)
piiGatingMode = "local-only"
