name: Goli Auto-Task

on:
  issues:
    types: [labeled]

jobs:
  run-goli:
    if: github.event.label.name == 'goli-task'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Goli-CLI
        run: npm install -g goli-cli@latest

      - name: Run Goli on issue
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY:     ${{ github.event.issue.body }}   
          ISSUE_NUM:      ${{ github.event.issue.number }}
        run: |
          printf '%s' "$ISSUE_BODY" > /tmp/issue-body.txt
          # CI Mode: bypasses interactive HITL but respects safety
          goli run \
            --task-file /tmp/issue-body.txt \
            --auto \
            --branch "goli/issue-${ISSUE_NUM}"
          
          gh pr create \
            --title "goli: $(head -1 /tmp/issue-body.txt | cut -c1-60)" \
            --body  "Closes #${ISSUE_NUM}"$'\n\n'"_Generated by Goli-CLI_" \
            --base  main \
            --head  "goli/issue-${ISSUE_NUM}"
