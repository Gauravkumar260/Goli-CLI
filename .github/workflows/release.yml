name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write
 
jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci --ignore-scripts
      - run: npm run build

      - name: Publish packages
        run: |
          pub() {
            if npm view "@goli-cli/$1" version >/dev/null 2>&1; then
              echo "skip $1 (already published)"
            else
              npm publish --workspace "packages/$1" --access public
            fi
          }
          pub shared
          pub sandbox
          pub config
          pub agent-core
          pub tool-system
          pub memory-engine
          pub context-engine
          pub llm-providers
          pub orchestration
          pub approval
          pub observability
          pub i18n
          pub plugins
          pub sdk
          pub evals
          if npm view "@goli-cli/cli" version >/dev/null 2>&1; then
            echo "skip cli (already published)"
          else
            npm run release:cli
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
