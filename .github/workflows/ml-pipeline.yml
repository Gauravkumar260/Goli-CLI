name: ML Pipeline

on:
  push:
    branches: [main, dev]
    paths: ['services/ml-pipeline/**']
  pull_request:
    branches: [main, dev]
    paths: ['services/ml-pipeline/**']

jobs:
  python-checks:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile all Python sources
        run: python -m compileall -q services/ml-pipeline
