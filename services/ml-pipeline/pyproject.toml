# GOLI-CLI Python ML/RL Pipeline — PEP 621 project metadata.
#
# NOTE: this directory is deliberately NOT part of the npm workspaces
# (`apps/*`, `packages/*`). It is Python, not Node. Invoke it through
# the `Makefile` in this directory, never through npm.
#
# The pinned dependency set below mirrors `requirements.txt` (kept in
# sync by hand). Pins must not drift — TRL/vLLM/transformers version
# mismatches are a common source of silent training failures.
#
# Python: 3.10+ (3.11 recommended)  |  CUDA: 12.1+  |  GPU: 8A-H100/H200

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goli-ml-pipeline"
version = "0.1.0"
description = "GOLI-CLI Python ML/RL pipeline: GRPO + LoRA fine-tuning for open-weight models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core ML framework
    "torch==2.4.0",
    "transformers==4.44.2",
    "tokenizers==0.19.1",
    "accelerate==0.33.0",
    "safetensors==0.4.5",
    # Fine-tuning (TRL 0.12 required for vllm_mode="colocate")
    "trl==0.12.1",
    "peft==0.12.0",
    "datasets==2.20.0",
    "diffusers==0.30.2",
    # Inference engine (vLLM 0.6 for co-location)
    "vllm==0.6.3",
    "bitsandbytes==0.43.3",
    # Experiment tracking
    "wandb==0.17.9",
    "tensorboard==2.17.0",
    # Eval harness
    "swebench==2.0.0",
    # Utilities
    "pydantic==2.8.2",
    "rich==13.8.0",
    "tqdm==4.66.5",
    "numpy==1.26.4",
    "pandas==2.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "pytest-cov==5.0.0",
    "ruff==0.6.3",
    "mypy==1.11.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
