# LiteLLM Router — open-weight-only model routing.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: goli-cli
  labels:
    app: litellm
    component: model-router
spec:
  replicas: 2  # HA: LiteLLM is stateless
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-latest
          ports:
            - containerPort: 4000
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: master-key
            - name: ZAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: zai-api-key
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: deepseek-api-key
            - name: TOGETHERAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: togetherai-api-key
            - name: MOONSHOT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: moonshot-api-key
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
          command:
            - "--config"
            - "/app/config.yaml"
            - "--port"
            - "4000"
            - "--num_workers"
            - "4"
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 1Gi
              cpu: 1000m
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: goli-cli
spec:
  selector:
    app: litellm
  ports:
    - port: 4000
      targetPort: 4000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: goli-cli
data:
  config.yaml: |
    model_list:
      - model_name: glm-5.2
        litellm_params:
          model: openai/glm-5.2
          api_base: https://open.bigmodel.cn/api/paas/v4
          api_key: os.environ/ZAI_API_KEY
      - model_name: deepseek-v3
        litellm_params:
          model: deepseek/deepseek-chat
          api_key: os.environ/DEEPSEEK_API_KEY
      - model_name: qwen3-coder
        litellm_params:
          model: together_ai/Qwen/Qwen3-Coder-32B-Instruct
          api_key: os.environ/TOGETHERAI_API_KEY
      - model_name: kimi-k2.7-code
        litellm_params:
          model: moonshot/moonshot-v1-128k
          api_key: os.environ/MOONSHOT_API_KEY

    router_settings:
      fallbacks:
        - glm-5.2:
            - deepseek-v3
            - qwen3-coder

    litellm_settings:
      drop_params: true

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
