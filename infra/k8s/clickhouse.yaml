# ClickHouse for Langfuse trace storage.
#
# Production: use Altinity.Cloud or a managed ClickHouse for backups
# and HA. This StatefulSet is for development/staging clusters.

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clickhouse-pvc
  namespace: goli-cli
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi  # trace storage; grows ~1GB/day at 1000 traces/min
  storageClassName: standard
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: goli-cli
  labels:
    app: clickhouse
    component: langfuse-traces
spec:
  serviceName: clickhouse
  replicas: 1  # ClickHouse shards require ZooKeeper for replication; out of scope here.
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.3-alpine
          ports:
            - containerPort: 8123  # HTTP
            - containerPort: 9000  # Native
          env:
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: clickhouse-user
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: clickhouse-password
            - name: CLICKHOUSE_DB
              value: langfuse
          volumeMounts:
            - name: clickhouse-data
              mountPath: /var/lib/clickhouse
          resources:
            requests:
              memory: 2Gi
              cpu: 1000m
            limits:
              memory: 8Gi
              cpu: 4000m
          livenessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: clickhouse-data
          persistentVolumeClaim:
            claimName: clickhouse-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: goli-cli
spec:
  selector:
    app: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: 8123
    - name: native
      port: 9000
      targetPort: 9000
  clusterIP: None
