# Example Kubernetes Secrets for GOLI-CLI infrastructure.
#
# IMPORTANT: Do NOT commit real secrets. Use `kubectl create secret`
# or a secrets manager (Sealed Secrets, External Secrets, Vault) in
# production. This file is a template for reference only.
#
# Apply with:
#   kubectl apply -f secrets.yaml  # DEV ONLY
# For production, use:
#   kubectl create secret generic langfuse-secrets \
#     --from-literal=postgres-user=langfuse \
#     --from-literal=postgres-password=$(openssl rand -hex 32) \
#     ...

apiVersion: v1
kind: Secret
metadata:
  name: langfuse-secrets
  namespace: goli-cli
type: Opaque
stringData:
  postgres-user: langfuse
  postgres-password: CHANGE_ME_STRONG_PASSWORD
  database-url: postgresql://langfuse:CHANGE_ME_STRONG_PASSWORD@postgres:5432/langfuse
  clickhouse-user: langfuse
  clickhouse-password: CHANGE_ME_STRONG_PASSWORD
  nextauth-secret: CHANGE_ME_32_CHAR_RANDOM_STRING
  langfuse-salt: CHANGE_ME_32_CHAR_RANDOM_STRING
---
apiVersion: v1
kind: Secret
metadata:
  name: litellm-secrets
  namespace: goli-cli
type: Opaque
stringData:
  master-key: CHANGE_ME_sk_litellm_master_key
  zai-api-key: ""  # Set to use Z.AI's hosted GLM-5.2
  deepseek-api-key: ""  # Set to use DeepSeek fallback
  togetherai-api-key: ""  # Set to use Together AI fallback
  moonshot-api-key: ""  # Set to use Kimi fallback
---
apiVersion: v1
kind: Secret
metadata:
  name: vllm-secrets
  namespace: goli-cli
type: Opaque
stringData:
  hf-token: ""  # Set if downloading weights from HuggingFace Hub
