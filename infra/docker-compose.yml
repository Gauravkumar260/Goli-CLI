# GOLI-CLI Observability Stack — Docker Compose.
#
# Starts:
#   - Langfuse (observability UI) on :3000
#   - Postgres (Langfuse metadata) on :5432
#   - ClickHouse (Langfuse trace storage) on :8123
#   - LiteLLM Router (open-weight-only) on :4000
#   - vLLM (self-hosted GLM-5.2, optional) on :8000
#
# Usage:
#   cp .env.example .env  # edit secrets
#   docker compose up -d
#
# See README.md for resource requirements and production deployment notes.

services:
  # ─── Langfuse (Observability UI) ───────────────────────────────
  langfuse:
    image: langfuse/langfuse:2
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      LANGFUSE_SALT: ${LANGFUSE_SALT}
      # Disable telemetry in production (set to "false" for dev analytics).
      LANGFUSE_DISABLE_TELEMETRY: "true"
      # Optional: SSO config (see Langfuse docs).
      NEXTAUTH_URL: http://localhost:3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/public/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Postgres (Langfuse metadata) ──────────────────────────────
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── ClickHouse (Langfuse trace storage) ───────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    ports:
      - "8123:8123"  # HTTP
      - "9000:9000"  # Native
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: langfuse
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── LiteLLM Router (open-weight-only) ─────────────────────────
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      # Provider keys (only open-weight — closed-weight keys are NOT
      # loaded even if set, to enforce the legal gate at the router).
      ZAI_API_KEY: ${ZAI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      TOGETHERAI_API_KEY: ${TOGETHERAI_API_KEY}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY}
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"
      - "--num_workers"
      - "4"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health/liveliness"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── vLLM (self-hosted GLM-5.2, optional) ──────────────────────
  # Uncomment to self-host GLM-5.2 instead of using Z.AI's API.
  # Requires 8× H100 80GB GPUs and the model weights at VLLM_MODEL_PATH.
  #
  # vllm:
  #   image: vllm/vllm-openai:latest
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - ${VLLM_MODEL_PATH}:/model:ro
  #   environment:
  #     HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN}
  #   command:
  #     - "--model"
  #     - "/model"
  #     - "--tensor-parallel-size"
  #     - "8"
  #     - "--quantization"
  #     - "fp8"
  #     - "--max-model-len"
  #     - "1048576"
  #     - "--gpu-memory-utilization"
  #     - "0.9"
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 8
  #             capabilities: [gpu]
  #   restart: unless-stopped

volumes:
  postgres_data:
  clickhouse_data:
